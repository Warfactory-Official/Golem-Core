}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1c2028; --text: #e3e7ee; --muted: #98a1b2; --line: #2d333f; --accent: #6f9bff;

.panel p.hint { color: var(--muted); margin: -4px 0 10px; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

tr:hover td { background: var(--hover); }
.tablewrap { overflow-x: auto; max-width: 100%; }
.bar { height: 6px; background: var(--accent); border-radius: 3px; opacity: .7; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
select, input[type=text], button.btn { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
button.btn { cursor: pointer; } button.btn:hover { background: var(--hover); }
input[type=text] { min-width: 220px; }
canvas { display: block; width: 100%; }
.chart { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.crumbs a { color: var(--accent); cursor: pointer; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.muted { color: var(--muted); }
.kv td:first-child { color: var(--muted); width: 220px; }
code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
@media (max-width: 600px) { main { padding: 12px 16px 40px; } nav { flex-wrap: nowrap; overflow-x: auto; } nav button { white-space: nowrap; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } input[type=text] { min-width: 0; width: 100%; } }
</style>
</head>

    if (i >= 0) zoom = zoom.slice(0, i + 1); else {
      // Rebuild the ancestor chain from the current view's root to the clicked node.
      const chain = []; (function seek(cur, acc) { if (cur === n) { chain.push(...acc, cur); return true; }
        for (const k of cur.c) if (seek(k, [...acc, cur])) return true; return false; })(zoom[zoom.length - 1], []);
      zoom = [...zoom.slice(0, -1), ...chain]; }
    draw(); };

  wrap.redraw = draw;

}

/* ---------- derived numbers ---------- */
const frameStats = client && client.frames && client.frames.count ? client.frames : null;
const fps = v => v > 0 ? 1000 / v : 0;
function lowFps(series, fraction) {
  // "1% low": average FPS over the slowest 1% of frames, as frame-time tools report it.
  if (!series || !series.v || !series.v.length) return null;
  const sorted = [...series.v].sort((a, b) => b - a), n = Math.max(1, Math.floor(sorted.length * fraction));
  let sum = 0; for (let i = 0; i < n; i++) sum += sorted[i]; return 1000 / (sum / n);
}
const DRIVER_WAITS = /glfwSwapBuffers|nglfwSwapBuffers|glFinish|glClientWaitSync|glGetQueryObject|glFenceSync|glMapBuffer|nglMapBufferRange/;
const IDLE_WAITS = /Thread\.sleep|Object\.wait|Unsafe\.park|LockSupport\.park|glfwWaitEvents|nglfwWaitEventsTimeout/;
function waitShare(thread, pattern) {
  // Share of a thread's sampled time whose innermost frame matches: driver waits (buffer swap, syncs) or idling (FPS cap).
  if (!thread) return null;
  let wait = 0;
  for (const [name, self] of thread.methods) if (pattern.test(name)) wait += self;
  return thread.timeMs ? wait / thread.timeMs : null;
}

// A call tree, method table and mod table for one thread's samples inside range r (seconds), or all of them.
function rangeProfile(tl, r) {
  const lo = r ? r[0] * 1e4 : -Infinity, hi = r ? r[1] * 1e4 : Infinity, w = tl.intervalMs;
  const root = {n: tl.thread, t: 0, s: 0, c: [], m: new Map()};
  const paths = new Map(), methods = new Map(), groups = new Map();
  const pathOf = node => { let p = paths.get(node); if (p) return p; p = [];
    for (let x = node; x !== 0; x = tl.parents[x]) p.push(tl.frames[tl.nodeFrames[x]]); p.reverse(); paths.set(node, p); return p; };
  const bump = (map, key, self, total) => { let e = map.get(key); if (!e) { e = [key, 0, 0]; map.set(key, e); } e[1] += self; e[2] += total; };
  for (let i = 0; i < tl.t.length; i++) {
    if (tl.t[i] < lo || tl.t[i] > hi) continue;
    let path = pathOf(tl.n[i]);
    if (!path.length) path = [`[${tl.states[tl.s[i]].toLowerCase()}, no Java frames]`];
    let cur = root; cur.t += w;
    const seen = new Set(), seenGroups = new Set();
    for (const frame of path) {
      let next = cur.m.get(frame);
      if (!next) { next = {n: frame, t: 0, s: 0, c: [], m: new Map()}; cur.m.set(frame, next); cur.c.push(next); }
      next.t += w; cur = next;
      if (!seen.has(frame)) { seen.add(frame); bump(methods, frame, 0, w); }
      const g = groupOf(frame); if (!seenGroups.has(g)) { seenGroups.add(g); bump(groups, g, 0, w); }
    }
    cur.s += w;
    const top = path[path.length - 1]; bump(methods, top, w, 0); bump(groups, groupOf(top), w, 0);
  }
  (function sort(n) { n.c.sort((a, b) => b.t - a.t); n.c.forEach(sort); delete n.m; })(root);
  const rows = map => [...map.values()].sort((a, b) => b[2] - a[2]);
  return {root, methods: rows(methods), groups: rows(groups)};
}

section("threads", "Threads", () => {
  const out = [];
  const rows = sampler.threads.map(t => [t.name, t.timeMs, ...["RUNNABLE", "BLOCKED", "WAITING", "TIMED_WAITING"].map(s => (t.states[s] || 0))]);
  out.push(panel("Sampled threads", "Wall-clock time by thread state. Pool threads are folded by name (digits become #).",
    table([{name: "thread"}, {name: "sampled", num: true, fmt: ms, bar: true}, {name: "running", num: true, fmt: ms}, {name: "blocked", num: true, fmt: ms},
      {name: "waiting", num: true, fmt: ms}, {name: "timed wait", num: true, fmt: ms}], rows, {sort: 1, filter: true})));
  if (sampler.cpu && sampler.cpu.length) out.push(panel("CPU time per thread", "Exact CPU time each thread used during the capture, native code included.",
    table([{name: "thread"}, {name: "CPU", num: true, fmt: ms, bar: true}, {name: "of capture", num: true, fmt: (v, r) => pct(r[1], D.meta.seconds * 1000)}],
      sampler.cpu.map(r => [r[0], r[1], r[1]]), {sort: 1, filter: true})));
  if (jfr && jfr.cpu && jfr.cpu.length) out.push(panel("Process CPU load", "Share of all cores, sampled every second.", lineChart([
    {t: jfr.cpu.map(r => r[0]), v: jfr.cpu.map(r => 100 * r[1]), color: css("--accent"), label: "game"},
    {t: jfr.cpu.map(r => r[0]), v: jfr.cpu.map(r => 100 * r[2]), color: css("--muted"), label: "whole machine"}], {unit: "%", tMax: D.meta.seconds, height: 180})));
  if (jfr && jfr.locks && jfr.locks.length) out.push(panel("Lock contention", "Threads that waited at least 1 ms to enter a synchronized block.",
    table([{name: "monitor at site (thread)", code: true}, {name: "times", num: true, fmt: v => fmt(v, 0)}, {name: "total wait", num: true, fmt: ms, bar: true},
      {name: "longest", num: true, fmt: ms}], jfr.locks, {sort: 2, filter: true})));
  if (sampler.idle && sampler.idle.length) out.push(panel("Idle threads", "Threads never seen running.",
    el("p", {class: "muted"}, sampler.idle.map(r => r[0]).join(", "))));
  out.push(panel("Profiler overhead", null, el("p", {}, `${fmt(sampler.mainSamples, 0)} main-thread samples and ${fmt(sampler.poolSamples, 0)} full dumps; the sampler spent ${ms(sampler.overheadMs)} taking them (${pct(sampler.overheadMs, sampler.elapsedMs)} of the capture).`)));
  return out;
});

section("world", "World", () => {
  const out = [];
  const census = (rows, what) => table([{name: what, code: true}, {name: "count", num: true, fmt: v => fmt(v, 0), bar: true}], rows || [], {sort: 1, filter: true, limit: 200});
  if (client && client.census && client.census.entities) {
    out.push(el("div", {class: "grid2"},
      panel("Block entities within 64 blocks", "Most block-entity renderers draw within 64 blocks, so these are the ones a frame can pay for.", census(client.census.blockEntitiesWithin64, "block entity")),
      panel(`Block entities loaded on the client (${fmt(client.census.loadedChunks, 0)} chunks)`, null, census(client.census.blockEntities, "block entity")),
      panel(`Entities in the client level (${fmt(client.census.entityCount, 0)})`, null, census(client.census.entities, "entity"))));
  }
  const empty = server && server.levels ? server.levels.filter(l => !l.loadedChunks).map(l => l.name) : [];
  if (empty.length) out.push(el("p", {class: "muted"}, `Not loaded during the capture: ${empty.join(", ")}.`));
  if (server && server.levels) for (const level of server.levels.filter(l => l.loadedChunks)) out.push(el("div", {class: "grid2"},
    panel(`${level.name}: entities`, `${fmt(level.loadedChunks, 0)} loaded chunks`, census(level.entities, "entity")),
    panel(`${level.name}: block entities near players`, `${fmt(level.chunksAroundPlayers, 0)} chunks within view distance of a player`, census(level.blockEntitiesAroundPlayers, "block entity"))));
  if (!out.length) out.push(panel("World", "No census was taken."));
  return out;
});

section("system", "System", () => {
  const sys = {...D.system}; delete sys.mods; delete sys.jvmArgs;
  const out = [el("div", {class: "grid2"}, panel("Capture", null, kv(D.meta)), panel("Machine and JVM", null, kv(sys)))];
  if (client && client.setup) out.push(panel("Graphics setup", null, kv(client.setup)));
  out.push(panel("JVM arguments", "Paths under your home folder are shown as ~; arguments that look like secrets are left out.",
    el("p", {}, (D.system.jvmArgs || []).map(a => el("code", {}, a)).flatMap(c => [c, " "]))));
  out.push(panel(`Mods (${(D.system.mods || []).length})`, null, table([{name: "id", code: true}, {name: "version", code: true}], D.system.mods || [], {sort: -1, filter: true, limit: 1000})));
  return out;
});

/* ---------- wiring ---------- */
$("#meta").textContent = `${D.meta.created.replace("_", " ")} · ${D.meta.side} · Minecraft ${D.meta.minecraft} ${D.meta.loader} · Golem Core ${D.meta.golemCore || "?"} · ${fmt(D.meta.seconds, 1)} s`;
const built = {};
function open(id) {
  for (const b of $("#nav").children) b.classList.toggle("on", b.dataset.id === id);
  for (const s of $("#main").children) s.classList.toggle("on", s.id === id);
  if (!built[id]) { const s = sections.find(x => x.id === id); $("#" + id).append(...s.build()); built[id] = true; }
  try { localStorage.setItem("golem-profile-tab", id); } catch (e) { /* storage blocked */ }
}
for (const s of sections) {
  $("#nav").append(el("button", {"data-id": s.id, onclick: () => open(s.id)}, s.title));
  $("#main").append(el("section", {id: s.id}));
}
let first = "overview"; try { const t = localStorage.getItem("golem-profile-tab"); if (sections.some(s => s.id === t)) first = t; } catch (e) { /* storage blocked */ }
open(first);
$("#dl").onclick = () => { const a = el("a", {href: URL.createObjectURL(new Blob([JSON.stringify(D)], {type: "application/json"})), download: `profile-${D.meta.created}-${D.meta.side}.json`}); a.click(); };
$("#theme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; brushCharts.clear(); selectionListeners.length = 0;
  // Canvas colours are read at draw time, so every built tab is rebuilt in the new theme.
  let current = "overview";
  for (const s of $("#main").children) { if (s.classList.contains("on")) current = s.id; delete built[s.id]; s.replaceChildren(); }
  open(current); };
</script>
</body>
</html>
