modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@golem.homepage@"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# GemRender instances gem-declared machines when installed; without it they draw through their vanilla renderers.
# 0.1.14 names no refmap for its mixins here, so it crashes outside a dev run.
[[dependencies.${mod_id}]]
modId = "gemrender"
mandatory = false
versionRange = "(0.1.14,)"
ordering = "NONE"
side = "CLIENT"
