modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@golem.homepage@"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# GemRender instances gem-declared machines when installed; without it they draw through their vanilla renderers.
# GemRender before 0.1.21 is refused (0.1.14 crashed outside a dev run; 0.1.21 is the oldest release tested with Core).
[[dependencies.${mod_id}]]
modId = "gemrender"
mandatory = false
versionRange = "[0.1.21,)"
ordering = "NONE"
side = "CLIENT"
