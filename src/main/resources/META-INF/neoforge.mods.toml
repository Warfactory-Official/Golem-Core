modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@golem.homepage@"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[mixins]]
config = "golemcore.mixins.json"

[[mixins]]
config = "golemcore.harness.mixins.json"
${sable_mixins}
${gemrender_mixin_config}

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# GemRender instances gem-declared machines when installed; without it they draw through their vanilla renderers.
[[dependencies.${mod_id}]]
modId = "gemrender"
type = "optional"
versionRange = "[0.1.14,)"
ordering = "NONE"
side = "CLIENT"
