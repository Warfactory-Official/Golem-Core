# Root defaults. Values marked [VERSIONED] are overridden per node in
# versions/<node>/gradle.properties — a node that needs a different value MUST declare it there.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=golemcore
mod.name=Golem Core
mod.group=dev.golem
mod.version=1.0.2
mod.author=Golem
mod.license=LGPL-3.0
# One short line, shown last in the mod list; details in CREDITS.txt (shipped in the jar).
mod.credits=Instancing through GemRender by MrNorwood (optional); Connected textures from HBM's Nuclear Tech Mod 1.7.10.
mod.homepage=https://github.com/Warfactory-Official/Golem-Core
mod.sources=https://github.com/Warfactory-Official/Golem-Core
mod.issues=https://github.com/Warfactory-Official/Golem-Core/issues
mod.description=Cross-version, cross-loader compatibility layer. Ships the newest Minecraft API shapes and backports them onto older versions.

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

# Fabric Loom version, applied to whichever variant loom-back-compat selects for the node.
loomx.loom_version=1.16.3

# JEI (compile-only facade dependency). [VERSIONED]
deps.gemrender=[VERSIONED]
deps.gemrender_flywheel=
deps.jei_mc=[VERSIONED]
deps.jei=[VERSIONED]

# Release upload (gradle/mod/publish.gradle.kts documents every key). A blank project id skips that site. Tokens
# come from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
golem.build.publish.modrinthProject=sRSYLbXB
golem.build.publish.curseforgeProject=1719361
golem.build.publish.fabricRequires=fabric-api

# GemRender is the CurseMaven file deps.gemrender. To test an unreleased build, set gemrender.dir (the GemRender
# checkout) and gemrender.version (Golem Core's gradle/mod/gemrender-local.gradle.kts).
