// The shader stack, shared by build.gradle and build.fabric.gradle.
//
// Iris, Sodium and one of the two Flywheel/Iris bridges are the same Modrinth projects on every
// loader, and what has to happen to run them is the same too: strip the bridge's nested Flywheel,
// empty run/mods, copy the stack in, and write an iris.properties that the game will not argue
// with. What differs is only how the jars are RESOLVED -- Loom remaps a mod dependency and
// ModDevGradle does not -- so the `shaderMod` and `colorwheelMod` configurations are declared by
// each buildscript and this file only reads them.
//
// The caller sets, before applying:
//     ext.shaderRunDir      the run directory whose mods/, shaderpacks/ and config/ are staged
//     ext.shaderInternalDir gemrender-internal, whose shaderpacks/ are copied in when present
// and may read back `irisEnabled` afterwards.

ext.irisEnabled = project.hasProperty('iris') && project.property('iris').toString() != 'false'

// Sodium alone (sodium_standalone_version): the pack's chunk renderer without Iris.
def sodiumAlone = project.hasProperty('sodium') && project.property('sodium').toString() != 'false'

// Swaps the Flywheel/Iris bridge. iris-flw-compat is the default; Colorwheel is the other
// implementation of the same job and the two cannot be installed together, so this picks one:
//     ./gradlew :1.21.1:runClient -Piris -Pshaders=<pack>.zip -Pcolorwheel
// A bare -Pcolorwheel takes the jar named by colorwheel_version, which is a Modrinth version ID;
// -Pcolorwheel=<path> takes a local build of the bridge instead.
def colorwheelRequested = project.hasProperty('colorwheel')
        && project.property('colorwheel').toString() != 'false'

def colorwheelLocalJar = null
if (colorwheelRequested) {
    def value = project.property('colorwheel').toString()
    if (!value.isEmpty() && value != 'true') {
        colorwheelLocalJar = file(value)
    }
}
def shaderPack = project.hasProperty('shaders') ? project.property('shaders').toString() : null

def shaderOptions = project.hasProperty('shaderOptions')
        ? project.property('shaderOptions').toString()
        : null

tasks.register('stripIrisFlwJarJar', Jar) {
    group = 'build'
    description = 'Removes iris-flw-compat\'s nested Flywheel, which duplicates the classpath one.'
    archiveFileName = 'iris-flywheel-compat-nojarjar.jar'
    destinationDirectory = layout.buildDirectory.dir('shaderMods')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({
        def jar = configurations.shaderMod.find { it.name.contains('iris-flw-compat') }
        jar == null ? [] : zipTree(jar)
    }) {
        exclude 'META-INF/jarjar/**'
    }
}

tasks.register('prepareRunMods') {
    group = 'build'
    description = 'Syncs run/mods, run/shaderpacks and run/config/iris.properties to the -P flags.'
    if (irisEnabled && !colorwheelRequested) {
        dependsOn tasks.named('stripIrisFlwJarJar')
    }

    doLast {
        def modsDir = new File(shaderRunDir, 'mods')
        modsDir.mkdirs()
        modsDir.listFiles({ File f -> f.name.endsWith('.jar') } as FileFilter)
                ?.each { it.delete() }

        if (sodiumAlone) {
            if (irisEnabled) {
                throw new GradleException('-Psodium stages Sodium without Iris; drop -Piris.')
            }
            copy {
                from configurations.sodiumMod
                into modsDir
            }
            logger.lifecycle "Shader stack: ${configurations.sodiumMod.files*.name.join(', ')} (no Iris)"
        } else if (irisEnabled) {
            def others = configurations.shaderMod.findAll { !it.name.contains('iris-flw-compat') }
            def bridge
            if (colorwheelRequested) {
                bridge = colorwheelLocalJar ?: configurations.colorwheelMod.files.find { true }
                if (bridge == null) {
                    throw new GradleException("-Pcolorwheel: nothing to install. Set colorwheel_version in " +
                            "versions/${project.name}/gradle.properties, or pass a jar: -Pcolorwheel=<path>.")
                }
            } else {
                // Not every node has an iris-flw-compat built against this Flywheel: 1.20.1's newest
                // is for the old com.jozufozu one. Colorwheel does the same job there, so say so
                // rather than staging the empty jar the strip task produces from nothing.
                if (configurations.shaderMod.every { !it.name.contains('iris-flw-compat') }) {
                    throw new GradleException("-Piris: no iris-flw-compat for Minecraft "
                            + "${stonecutter.current.version}. Set irisflw_version in "
                            + "versions/${project.name}/gradle.properties if one "
                            + "exists, or add -Pcolorwheel to bridge through Colorwheel instead.")
                }
                bridge = tasks.named('stripIrisFlwJarJar').get().archiveFile.get().asFile
            }
            copy {
                from others
                from bridge
                into modsDir
            }
            logger.lifecycle "Shader stack: ${(others + [bridge]).collect { it.name }.join(', ')}"
        } else {
            logger.lifecycle 'Shader stack: none (run/mods emptied)'
        }

        def packSource = new File(shaderInternalDir, 'shaderpacks')
        if (packSource.isDirectory()) {
            copy {
                from packSource
                into new File(shaderRunDir, 'shaderpacks')
            }
        } else if (shaderPack != null) {
            logger.lifecycle "Shader packs: no ${packSource}; '${shaderPack}' must already be in " +
                    "run/shaderpacks."
        }

        def irisConfig = new File(shaderRunDir, 'config/iris.properties')
        irisConfig.parentFile.mkdirs()
        irisConfig.text = """\
                |# Written by Gradle's prepareRunMods task. Hand edits are overwritten every run.
                |enableShaders=${shaderPack != null}
                |shaderPack=${shaderPack ?: ''}
                |allowUnknownShaders=true
                |disableUpdateMessage=true
                |enableDebugOptions=false
                |maxShadowRenderDistance=32
                |colorSpace=SRGB
                |""".stripMargin()
        logger.lifecycle "Iris: ${shaderPack != null ? "shaders on, pack '${shaderPack}'" : 'shaders off'}"

        if (shaderPack != null) {
            def packOptions = new File(shaderRunDir, "shaderpacks/${shaderPack}.txt")
            packOptions.parentFile.mkdirs()
            if (shaderOptions != null) {
                packOptions.text = shaderOptions.split(',')
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() }
                        .join('\n') + '\n'
                logger.lifecycle "Shader options: ${shaderOptions}"
            } else {

                packOptions.delete()
            }
        }
    }
}

