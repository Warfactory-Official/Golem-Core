deps.minecraft=1.21.1
deps.minecraft_range=[1.21.1, 1.22)
java_version=21
pack_format=34

deps.neoforge=21.1.248
deps.neoforge_loader_range=[4,)

deps.jei_mc=1.21.1
deps.jei=19.44.0.401
# REI (Roughly Enough Items), an optional peer like JEI: compile-only for the dev.golem.core.rei adapter,
# never in Core's own dev runs. Blank disables it for this node (the `rei` constant).
deps.rei=16.0.799

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=1.21.1
deps.cc=1.120.2

# Sable (moving block sub-levels, the engine under Create Aeronautics), an optional peer: compiled against
# (src/sable, the backend of dev.golem.core.world.SubLevels), never shipped or required. Blank disables it.
deps.sable_mc=1.21.1
deps.sable=2.0.6
deps.sable_companion=1.6.0
# Sodium's public API, for the Sable root's animated-sprite marking (the dev run's Sodium is the same version).
deps.sodium_api=0.8.12+mc1.21.1

# KubeJS (7.x API line), an optional peer: compiled against by the dev.golem.core.kubejs adapter (recipe schemas for
# every RecipeTables table, dev.golem.core.script bindings and events), never shipped or required; never in Core's own
# dev runs. Blank disables it for this node (the `kubejs` constant). Rhino as KubeJS's POM names them.
deps.kubejs=2101.7.2-build.379
deps.kubejs_rhino=2101.2.7-build.81
deps.kubejs_architectury=

# Jade (block-info HUD), an optional peer: compiled against by the dev.golem.core.jade adapter (dev.golem.core.info
# gauges, tanks, redirects), never shipped or required. Modrinth maven. Blank disables it (the `jade` constant).
deps.jade=15.10.6+neoforge

# GemRender 0.1.17 (instancing for gem-declared machines; carries Flywheel), an optional client peer: compiled
# against, never shipped or required. CurseForge file id (CurseMaven).
deps.gemrender=9293415
# Flywheel's API: GemRender nests or requires Flywheel here rather than exposing its classes.
deps.gemrender_flywheel=dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6-44
# Mo' Bends 5.6.3, an optional client peer: compiled against (src/mobends, the backend of
# dev.golem.core.render.BodyAnimations), never shipped or required. Modrinth version id. Blank disables it.
deps.mobends=gkZMPuSh
# Applied Energistics 2, an optional peer: compiled against by dev.golem.core.ae2 (autocraft machines, cell
# contents), never shipped or required. Modrinth maven version (id where loaders share a number).
deps.ae2=19.2.18
