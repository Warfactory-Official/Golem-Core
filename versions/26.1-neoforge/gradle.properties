deps.minecraft=26.1.2
deps.minecraft_range=[26.1.2, 26.2)
java_version=25

deps.neoforge=26.1.2.114
# The oldest NeoForge the released jar accepts (its neoforge.mods.toml floor); blank = deps.neoforge. 109 because KubeJS
# 8.0.6 crashes with 110+ (see deps.neoforge_kubejs), so a KubeJS pack can run 109 until KubeJS releases its fix.
deps.neoforge_floor=26.1.2.109
deps.neoforge_loader_range=[4,)
pack_format=84

deps.jei_mc=26.1.2
deps.jei=29.43.0.107
# REI (Roughly Enough Items), an optional peer like JEI: compile-only for the dev.golem.core.rei adapter,
# never in Core's own dev runs. Blank disables it for this node (the `rei` constant).
deps.rei=26.1.819

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=26.1.2
deps.cc=1.120.0

# KubeJS (8.x API line), an optional peer: compiled against by the dev.golem.core.kubejs adapter (recipe schemas for
# every RecipeTables table, dev.golem.core.script bindings and events), never shipped or required; never in Core's own
# dev runs. Blank disables it for this node (the `kubejs` constant). Rhino as KubeJS's POM names them.
deps.kubejs=26.1.2-8.0.6
# Dev runs with -Pkubejs.run=true only: the newest NeoForge KubeJS 8.0.6 works with (see new-hbm/versions/26.1-neoforge).
deps.neoforge_kubejs=26.1.2.109
deps.kubejs_rhino=2101.2.8-build.91
deps.kubejs_architectury=

# Jade (block-info HUD), an optional peer: compiled against by the dev.golem.core.jade adapter (dev.golem.core.info
# gauges, tanks, redirects), never shipped or required. Modrinth maven. Blank disables it (the `jade` constant).
deps.jade=26.1.12+neoforge

# GemRender 0.1.14 (instancing for gem-declared machines; carries Flywheel), an optional client peer: compiled
# against, never shipped or required. CurseForge file id (CurseMaven).
deps.gemrender=9111067
# Sodium's API: GemRender 0.1.14's 26.1 Flywheel stubs its Sodium hook, so Core registers that predicate itself.
deps.gemrender_sodium_api=0.9.2+mc26.1.2
# Applied Energistics 2, an optional peer: compiled against by dev.golem.core.ae2 (autocraft machines, cell
# contents), never shipped or required. Modrinth maven version (id where loaders share a number).
deps.ae2=26.1.13-beta
