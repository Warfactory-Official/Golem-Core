deps.minecraft=1.20.1
deps.minecraft_range=>=1.20.1 <1.21
java_version=17
pack_format=15

deps.fabric_loader=0.19.5
deps.fabric_api=0.92.12+1.20.1

# JEI 15.x uses the pre-IRecipeType facade branch.
deps.jei_mc=1.20.1
deps.jei=15.49.0.188
# REI (Roughly Enough Items), an optional peer like JEI: compile-only for the dev.golem.core.rei adapter,
# never in Core's own dev runs. Blank disables it for this node (the `rei` constant).
deps.rei=12.1.785
# REI's Fabric POM puts these at runtime scope (26.1), but REI's API names their types: compile against them too.
deps.rei_cloth=11.0.99
deps.rei_architectury=9.0.7

# Team Reborn Energy (Fabric's de-facto energy API): optional, compile-only in Core, dev-runtime only in HBM
deps.tr_energy=3.0.0

# CC: Tweaked, an optional peer: compiled against (peripherals, dev.golem.core.computer), never shipped or
# required. Blank
# disables the integration for this node (the `computercraft` constant).
deps.cc_mc=1.20.1
deps.cc=1.120.2

# KubeJS (6.x API line), an optional peer: compiled against by the dev.golem.core.kubejs adapter (recipe schemas for
# every RecipeTables table, dev.golem.core.script bindings and events), never shipped or required; never in Core's own
# dev runs. Blank disables it for this node (the `kubejs` constant). Rhino and Architectury as KubeJS's POM names them.
deps.kubejs=2001.6.5-build.26
deps.kubejs_rhino=2001.2.2-build.17
deps.kubejs_architectury=9.1.12

# Jade (block-info HUD), an optional peer: compiled against by the dev.golem.core.jade adapter (dev.golem.core.info
# gauges, tanks, redirects), never shipped or required. Modrinth maven. Blank disables it (the `jade` constant).
deps.jade=11.13.3+fabric

# GemRender 0.1.20 (instancing for gem-declared machines; carries Flywheel), an optional client peer: compiled
# against, never shipped or required. CurseForge file id (CurseMaven).
deps.gemrender=9366682
# Flywheel's API: GemRender nests or requires Flywheel here rather than exposing its classes.
deps.gemrender_flywheel=dev.engine-room.flywheel:flywheel-fabric-api-1.20.1:1.0.6-281
# Applied Energistics 2, an optional peer: compiled against by dev.golem.core.ae2 (autocraft machines, cell
# contents), never shipped or required. Modrinth maven version (id where loaders share a number).
deps.ae2=xIOhOI9C
