# Builds every node (chiseledBuild) and publishes the release jars as a GitHub pre-release.
# Runs on pushes to main that change a build input (see paths below) and on demand.
name: Pre-release

on:
  push:
    branches: [main]
    # Only changes that can alter a jar: sources, build scripts and per-node versions, and the license
    # files packed into every jar. Docs, CHANGELOG.md, harness scenarios and .github/ do not start a build.
    paths:
      - 'src/**'
      - 'versions/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Each node compiles on its own toolchain (1.20.1 -> 17, 1.21.1 -> 21, 26.1 -> 25). The last
      # one listed becomes JAVA_HOME, which runs Gradle itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build every node
        # ModDevGradle builds Minecraft through its binary pipeline whenever CI=true (GitHub always sets
        # it). That jar keeps Forge's signature digests over remapped classes (SecurityException in the
        # 1.20.1 Forge tests) and loses parameter names, so build with the local recompile pipeline.
        env:
          CI: "false"
        run: bash ./gradlew chiseledBuild --no-daemon --stacktrace

      - name: Collect release jars
        id: jars
        run: |
          mkdir -p dist
          # build/libs holds the release jar per node (remapJar/reobfJar/jar); devlibs is not shipped.
          find versions/*/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)" || { echo "No jars produced"; exit 1; }
          version=$(grep -E '^mod.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.jars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Golem Core ${{ steps.jars.outputs.version }} build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.jar

      # Keep only the newest automated build: delete every older pre-release this workflow made (its tags
      # end in -build.<run number>) along with its tag. Real releases and beta/alpha tags never match.
      - name: Delete previous pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: ${{ steps.jars.outputs.tag }}
        run: |
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | { grep -E '^v.+-build\.[0-9]+$' || true; } | { grep -vxF "$KEEP" || true; } \
            | while read -r tag; do
                echo "Deleting pre-release $tag"
                gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
              done
